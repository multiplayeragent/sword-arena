  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffd23f; text-align: left; }

<script type="module">
/* ═══ SWORD ARENA · a Multiplayer Agent starter ════════════════════════════════════════
 * Third-person sword fights on a floating stone arena: swing, block, dodge-roll, and
 * knock people out (or off the edge). Versus, 2–6 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ knockouts to win, swings, block, roll, movement, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ARENA ......... the floating platform, braziers, banners, the sky and the clouds below
 *   KNIGHTS ....... the knight model and its poses (swing, block, roll, reel); everyone else drawn from state
 *   COMBAT ........ moving, swinging, hit checks, taking a hit (the same code for you and the bots)
 *   EFFECTS ....... sword trails, sparks, KO stars, sounds
 *   MATCH (HOST) .. knockouts, timer, winner, restart. Only the host writes these.
 *   BOTS (HOST) ... close in, circle, swing, block when you wind up, roll away. The host runs them.
 *   ME ............ your knight. Each player writes only its own.
 *   HUD & RESULTS . knockouts, health, kill feed, results card, leaderboard
 *   INPUT ......... pointer lock + WASD; on touch a move stick, drag to look, SWING, BLOCK, ROLL
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, facing,
 *     alive, health, and the move it is doing with a counter so others replay it) about
 *     15 times a second and at once when a move starts, `dth` {m, n, by} when it is knocked
 *     out (match id, KOs taken so far, by whom), `rdy` (Play again), `hb` (heartbeat) once a
 *     second, and `n`/`c` (name, color) once.
 *   - HITS ARE DECIDED BY THE ATTACKER: your browser checks your swing against the knights as
 *     YOU see them and sends "hit" {to, by, dmg, kx, kz, heavy}. The one hit decides what
 *     that means for itself: dodged (mid-roll), blocked (shield up and facing you) or hurt,
 *     because only it knows its own state. On a block it sends "blocked" {to} back and the
 *     attacker reels. The host does both jobs for the bots.
 *   - Falling off the edge is your own fact too: it counts as a KO for whoever hit you last.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` (id, v, phase,
 *     endsAt, knockouts, kill feed, results) and `bots`. It credits a KO when it sees a
 *     player's `dth.n` go up (`match.cr` remembers which are counted), so a new host adopts
 *     both from state and carries on: no reset.
 *   - A new match starts only when the host bumps match.id; every client then respawns.
 *   - ?attract plays offline with bots only and an orbiting camera (the preview video).
 *   - Leaderboard "sword-kos": your knockouts in one match, kept at your best.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  respawnMs: 2500,      // time knocked out before you're back
  shieldMs: 1200,       // nobody can hit you this long after you come back
  hp: 100,
  // Swings 1 and 2 of a combo are light; the 3rd is a big overhead hit. Times in ms from the click.
  light: { dmg: 16, reach: 2.6, arc: 1.1, push: 5, from: 110, to: 250, total: 420 },
  heavy: { dmg: 30, reach: 3.0, arc: 1.35, push: 13, from: 230, to: 380, total: 680 },
  comboMs: 500,         // swing again within this long after a swing to keep the combo going
  blockSlow: 0.4,       // walking speed while your shield is up
  blockHeavy: 0.4,      // a blocked heavy swing still does this share of its damage
  staggerMs: 650,       // how long an attacker reels after hitting a raised shield
  hitStunMs: 280,       // how long a hit stops you
  rollMs: 420, rollSpeed: 12.5, rollCooldownMs: 650,
  rollSafe: [30, 340],  // the part of a roll where nothing can hit you (ms)
  speed: 6.4,
  radius: 13,           // the arena floor; step past it and you fall
  look: 0.0024,         // mouse sensitivity (touch uses 2.4x)
  botAggro: 0.55,       // chance a bot in reach swings each time it thinks

const BOT_NAMES = ["Sir Bonk", "Dame Clang", "Sir Wobble", "Lady Parry", "Sir Dent", "Dame Swish"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',

const ATTRACT = new URLSearchParams(location.search).has("attract");

// ── ARENA ───────────────────────────────────────────────────────────────────────────

}

scene.add(new THREE.HemisphereLight("#cfe3ff", "#c9734a", 1.7));
const sun = new THREE.DirectionalLight("#ffe2bd", 2.2); sun.position.set(-14, 22, 10); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0005;

// The sky: a big ball painted from deep blue at the top to a warm glow at the horizon.
const skyTex = canvasTex(4, 256, (c) => { const g = c.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, "#4b6fd1"); g.addColorStop(0.45, "#9fb8ef"); g.addColorStop(0.62, "#ffd3a8"); g.addColorStop(1, "#f7a77c"); c.fillStyle = g; c.fillRect(0, 0, 4, 256); });

// The floor: stone rings round a sun emblem, drawn once into a canvas.
const R = CONFIG.radius;
const floorTex = canvasTex(1024, 1024, (c) => {
  c.fillStyle = "#d8c4a4"; c.fillRect(0, 0, 1024, 1024);
  const rnd = mulberry32(4);
  for (let ring = 0; ring < 9; ring++) {
    const r0 = 60 + ring * 52, r1 = r0 + 52, n = 8 + ring * 6;
    for (let k = 0; k < n; k++) {

    }
  }

});
const stoneSide = new THREE.MeshStandardMaterial({ color: "#a98d6c", roughness: 0.95, flatShading: true });
const floor = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 0.96, 1.6, 64), [stoneSide, new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }), stoneSide]);
floor.position.y = -0.8; floor.receiveShadow = true; scene.add(floor);
const rockGeo = new THREE.ConeGeometry(R * 0.95, 13, 14, 3); rockGeo.rotateX(Math.PI);
{ const p = rockGeo.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) < 6) p.setXYZ(i, p.getX(i) * (0.85 + seeded() * 0.3), p.getY(i), p.getZ(i) * (0.85 + seeded() * 0.3)); rockGeo.computeVertexNormals(); }
const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({ color: "#8d6f57", roughness: 1, flatShading: true })); rock.position.y = -8.1; scene.add(rock);
// Braziers on the rim (you bump into them) and banners on little floating rocks outside.
const POSTS = [0, 1, 2, 3, 4, 5].map((k) => { const a = (k / 6) * Math.PI * 2 + Math.PI / 6; return { x: Math.cos(a) * (R - 0.7), z: Math.sin(a) * (R - 0.7) }; });
const flames = [];
for (const p of POSTS) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.6, 8), stoneSide); post.position.set(p.x, 0.8, p.z); post.castShadow = true; scene.add(post);
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.32, 0.4, 10), new THREE.MeshStandardMaterial({ color: "#3a3330", metalness: 0.5, roughness: 0.5 })); bowl.position.set(p.x, 1.75, p.z); scene.add(bowl);
  const fire = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1, 8), new THREE.MeshBasicMaterial({ color: "#ffb03b" })); fire.position.set(p.x, 2.35, p.z); scene.add(fire); flames.push(fire);
}
for (let k = 0; k < 8; k++) {
  const a = (k / 8) * Math.PI * 2, d = R + 7 + seeded() * 6, x = Math.cos(a) * d, z = Math.sin(a) * d, y = -2 + seeded() * 5;
  const isle = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4, 7), new THREE.MeshStandardMaterial({ color: "#8d6f57", flatShading: true })); isle.rotation.x = Math.PI; isle.position.set(x, y - 2, z); scene.add(isle);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 8, 6), new THREE.MeshStandardMaterial({ color: "#5a4636" })); pole.position.set(x, y + 4, z); scene.add(pole);
  const cloth = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 4.2), new THREE.MeshStandardMaterial({ color: COLORS[k % COLORS.length], side: THREE.DoubleSide, roughness: 0.8 }));

// Clouds far below: where you go if you step off.
const puffs = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: "#fff4ea", roughness: 1, flatShading: true, emissive: "#ffd9bf", emissiveIntensity: 0.35 }), 90);

// ── KNIGHTS ─────────────────────────────────────────────────────────────────────────

  add(new THREE.BoxGeometry(0.1, 0.1, 0.32), dark, 0, 0, 0, sword);
  add(new THREE.BoxGeometry(0.42, 0.08, 0.1), gold, 0, 0, 0.18, sword);
  add(new THREE.BoxGeometry(0.06, 0.17, 1.3), steel, 0, 0, 0.86, sword);
  const shieldArm = new THREE.Group(); shieldArm.position.set(0.46, 1.32, 0); body.add(shieldArm);

  if (e.pointerId === touch.look) touch.look = null;
});
for (const id of ["swing", "block", "roll"]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); b.classList.add("on"); if (id === "swing") swing(); else if (id === "roll") roll(); else input.block = true; });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { b.classList.remove("on"); if (id === "block") input.block = false; });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const orbit = { a: 0.6, look: new THREE.Vector3(0, 1, 0), focus: null, focusAt: 0 };
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const m = match();
  if (m) myTick(dt, m, now);
  syncViews(dt, now);
  if (!me.model || me.model.color !== myColor) { if (me.model) scene.remove(me.model.g); me.model = makeKnight(myColor, ""); me.model.bar.visible = false; }
  me.model.g.visible = me.alive;
  if (me.alive) poseKnight(me.model, { x: me.x, y: me.y, z: me.z, yaw: me.yaw, act: me.act, combo: me.combo, t: now - me.actAt, speed: me.speed, flash: me.flash }, dt);
  if (me.act === "s" && me.q !== me.trailQ) { me.trailQ = me.q; trailFx(me, me.combo); sfx("swish"); }
  if (isHost()) for (const b of host.bots.values()) if (b.act === "s" && b.q !== b.trailQ) { b.trailQ = b.q; trailFx(views.get(b.id) || b, b.combo); sfx("swish", b); }
  tickEffects(dt, now);
  if (ATTRACT || !me.joined) orbitCam(dt, now);
  else { // behind and above you, where the mouse points it
    const tall = camera.aspect < 1, back = tall ? 7.6 : 6.2, height = (tall ? 2 : 1.4) + camPitch * 4.5, tx = me.x, tz = me.z, ty = Math.max(me.y, -3); // a phone held upright sits farther back
    const want = new THREE.Vector3(tx - Math.sin(camYaw) * back * Math.cos(camPitch * 0.6), ty + height, tz - Math.cos(camYaw) * back * Math.cos(camPitch * 0.6));
    camera.position.lerp(want, 1 - Math.exp(-dt * 12));
    camera.lookAt(tx + Math.sin(camYaw) * 1.5, ty + 1.3, tz + Math.cos(camYaw) * 1.5);
  }
  if (shake > 0) { shake = Math.max(0, shake - dt * 2); camera.position.x += (Math.random() - 0.5) * shake * 0.4; camera.position.y += (Math.random() - 0.5) * shake * 0.4; }
  renderer.render(scene, camera);
  if (m && now - lastHud > 100) { lastHud = now; hud(m, now); }
  requestAnimationFrame(frame);
}
/** ?attract and behind the start card: circle slowly round one duel (whoever swung last and
 *  their nearest rival), close enough to see the swings. */
function orbitCam(dt, now) {
  const alive = [...views.values()].filter((v) => v.alive && v.y > -1);
  if (now > orbit.focusAt || !views.get(orbit.focus)?.alive) {
    const busy = alive.filter((v) => v.act === "s" || v.act === "b");
    orbit.focus = (busy[Math.floor(Math.random() * busy.length)] || alive[Math.floor(Math.random() * alive.length)] || {}).id;
    orbit.focusAt = now + 4000;
  }
  const v = views.get(orbit.focus), q = v && alive.filter((o) => o !== v).sort((p, r) => Math.hypot(p.x - v.x, p.z - v.z) - Math.hypot(r.x - v.x, r.z - v.z))[0];
  const gap = v && q ? Math.min(8, Math.hypot(q.x - v.x, q.z - v.z)) : 0, c = v ? (q && gap < 8 ? { x: (v.x + q.x) / 2, z: (v.z + q.z) / 2 } : v) : { x: 0, z: 0 };
  orbit.a += dt * 0.25; orbit.look.lerp(new THREE.Vector3(c.x, 1, c.z), 1 - Math.exp(-dt * 4));
  const d = v ? 6 + gap * 0.7 : 20;
  camera.position.lerp(new THREE.Vector3(orbit.look.x + Math.cos(orbit.a) * d, 2.6 + d * 0.3, orbit.look.z + Math.sin(orbit.a) * d), 1 - Math.exp(-dt * 3));
  camera.lookAt(orbit.look);
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("hit", (msg) => { if (!msg) return; if (msg.to === net.sessionId) hitMe(msg); else if (isHost() && host.bots.has(msg.to)) hitBot(msg); });
  net.on("blocked", (msg) => { if (msg && (msg.to === net.sessionId || (isHost() && host.bots.has(msg.to)))) reel(msg.to); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.col)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { $("net").textContent = ""; Object.assign(CONFIG, { koLimit: 999, matchMs: 9e6, respawnMs: 1500, botAggro: 0.75 }); }
  requestAnimationFrame(frame);
})();
</script>
